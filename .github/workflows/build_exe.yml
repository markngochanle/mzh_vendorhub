name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master, build-exe ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --clean vendor_management.spec

    - name: Package Release Files
      run: |
        mkdir release_package
        copy dist\vendor_management.exe release_package\
        copy config.ini release_package\
        if (Test-Path db.sqlite3) { copy db.sqlite3 release_package\ }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vendor-management-windows-exe
        path: release_package/
